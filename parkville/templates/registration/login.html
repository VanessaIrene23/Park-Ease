{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}<title>Login - ParkEase</title>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
        <h2 class="mb-4 text-center">Login</h2>
        <form method="POST" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3">Don't have an account? <a href="{% url 'register_user' %}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
