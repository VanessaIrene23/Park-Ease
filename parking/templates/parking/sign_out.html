{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}<title>Sign Out - ParkEase</title>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Sign Out - {{ vehicle.number_plate }}</h2>
        <form method="POST" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-warning">Sign Out & Generate Receipt</button>
            <a href="{% url 'vehicle_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
